<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>YouTube TV AC</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000000;
        }
        #yt-frame {
            width: 100vw;
            height: 100vh;
            border: none;
            display: block;
        }
        #splash {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease-out;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top-color: #ff0000;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
    <!-- Preload Cobalt H5VCC & Zero-Ad Polyfill before Leanback WebApp loads -->
    <script src="js/h5vcc_polyfill.js"></script>
    <script src="js/webos_keys.js"></script>
</head>
<body>
    <div id="splash">
        <div class="spinner"></div>
    </div>
    <iframe id="yt-frame" src="https://www.youtube.com/tv" allow="autoplay; fullscreen; encrypted-media"></iframe>

    <script>
        var frame = document.getElementById('yt-frame');
        var splash = document.getElementById('splash');

        frame.addEventListener('load', function() {
            setTimeout(function() {
                splash.style.opacity = '0';
                setTimeout(function() {
                    splash.style.display = 'none';
                }, 500);
            }, 1000);
            frame.focus();
        });

        window.addEventListener('focus', function() {
            frame.focus();
        });
    </script>
</body>
</html>
